<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230" role="img" aria-labelledby="t d">
  <title id="t">DAMNZ — Operator Dossier</title>
  <desc id="d">Purple Team operator · Defensive / Offensive · AI agents · Hack The Box</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1117"/>
      <stop offset="1" stop-color="#05080c"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#5eead4" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#5eead4" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="230" rx="10" fill="url(#bg)"/>
  <rect width="900" height="230" rx="10" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="899" height="229" rx="10" fill="none" stroke="#1f2a33"/>

  <!-- moving scanline -->
  <rect x="0" y="-60" width="900" height="60" fill="url(#scan)">
    <animate attributeName="y" from="-60" to="230" dur="5s" repeatCount="indefinite"/>
  </rect>

  <!-- corner brackets -->
  <g stroke="#5eead4" stroke-width="2" fill="none" stroke-opacity="0.8">
    <path d="M18 40V18H40"/><path d="M860 18H882V40"/>
    <path d="M18 190V212H40"/><path d="M860 212H882V190"/>
  </g>

  <!-- file tag -->
  <g font-family="Consolas, 'Courier New', monospace">
    <text x="40" y="50" font-size="12" fill="#5eead4" fill-opacity="0.75" letter-spacing="2">OPERATOR FILE // DMZ-3419151</text>
    <text x="860" y="50" font-size="12" fill="#64748b" text-anchor="end" letter-spacing="2">CLEARANCE: PUBLIC</text>

    <text x="40" y="118" font-size="64" font-weight="700" fill="#e2e8f0" letter-spacing="10">DAMNZ</text>
    <rect x="40" y="132" width="250" height="3" fill="#5eead4"/>

    <text x="40" y="164" font-size="17" fill="#cbd5e1">Purple Team · Defensive / Offensive</text>
    <text x="40" y="190" font-size="13" fill="#64748b">AD · Linux · Web exploitation  —  AI agents &amp; MCP  —  RF / embedded</text>

    <!-- right status block -->
    <g transform="translate(600 92)">
      <rect width="260" height="104" rx="6" fill="#0f172a" fill-opacity="0.7" stroke="#1f2a33"/>
      <text x="16" y="26" font-size="12" fill="#64748b">platform</text>
      <text x="244" y="26" font-size="12" fill="#e2e8f0" text-anchor="end">Hack The Box</text>
      <text x="16" y="50" font-size="12" fill="#64748b">rank</text>
      <text x="244" y="50" font-size="12" fill="#a3e635" text-anchor="end">Pro Hacker</text>
      <text x="16" y="74" font-size="12" fill="#64748b">level</text>
      <text x="244" y="74" font-size="12" fill="#e2e8f0" text-anchor="end">38 · Skilled</text>
      <text x="16" y="96" font-size="12" fill="#64748b">status</text>
      <circle cx="190" cy="92" r="4" fill="#5eead4">
        <animate attributeName="fill-opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="244" y="96" font-size="12" fill="#5eead4" text-anchor="end">active</text>
    </g>

    <!-- blinking cursor -->
    <rect x="300" y="72" width="16" height="44" fill="#5eead4">
      <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
